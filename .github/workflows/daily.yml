# Робот Laimex: каждое утро скачивает реестр VID и правила лотерей, готовит задания
# для Claude и пересобирает сайт. Работает бесплатно, потому что репозиторий публичный.
#
# Запускается:
#  - каждый день в 02:37 UTC (05:37 по Риге летом, 04:37 зимой);
#  - задачей Claude (tools/run_robot.py): в начале её работы и после того, как она нашла новые правила;
#  - вручную: вкладка Actions → laimex-daily → Run workflow;
#  - когда владелец загрузил файл реестра VID в data/inbox/ (если VID не пускает робота).
# Готовый сайт (папку docs/) Cloudflare Pages публикует сам после каждого изменения main:
# https://laimex.pages.dev/
#
# Режим API (без рутины Claude): создайте переменную LAIMEX_MODE=api
# и секрет ANTHROPIC_API_KEY в Settings → Secrets and variables → Actions.
name: laimex-daily
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/inbox/**"]
permissions:
  contents: write
  issues: write
concurrency:
  group: laimex
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Обновить данные и сайт, сохранить
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ vars.LAIMEX_MODE || 'agent' }}
        run: |
          git config user.name "laimex-bot"
          git config user.email "laimex-bot@users.noreply.github.com"
          # до трёх попыток: если рутина Claude успела что-то отправить, начинаем с её версии
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python -m laimex daily --mode "$MODE"
            git add data docs
            if git diff --cached --quiet; then echo "Изменений нет"; break; fi
            git commit -m "Робот: обновление $(date +%F)"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
      # При проблемах робот открывает issue «Laimex: что нужно сделать» с инструкцией по-русски,
      # и GitHub присылает письмо. Если упал предыдущий шаг, это тоже попадёт в issue.
      - name: Проверить здоровье и сообщить владельцу
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ job.status != 'success' && '--failed' || '' }}
        run: python -m laimex health --github-issue "$GITHUB_REPOSITORY" --run-url "$RUN_URL" $FAILED
