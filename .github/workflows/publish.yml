# Старый адрес https://kosjak0ff.github.io/laimex5/: публикует в ветку gh-pages страницу переезда
# на https://laimex.pages.dev/. Сам сайт публикует Cloudflare Pages при каждом изменении main.
name: laimex-old-address
on:
  push:
    branches: [main]
    paths: ["tools/old-site/**", "tools/publish_pages.sh"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: laimex-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Опубликовать страницу переезда
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish_pages.sh
