# Тесты робота: при каждом изменении кода в main и в pull request.
# Обновления данных (data/, docs/) тесты не запускают.
name: laimex-tests
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
